{% extends "base.html" %}
{% load static %}

{% block title %}{{post.title}}{% endblock %}

{% block content %}

<div class="main_container">
    <div class="post_description">
        <h3>{{ post.title }}</h3>
        <div class="tags">
            {% for tag in post.tags.all %}
            <a href="/?tag={{ tag.title|urlencode }}" class="tag">{{ tag.title }}</a>
            {% empty %}
            <span>No tags</span>
            {% endfor %}
        </div>

    </div>

    <div class="article_content">
        {{ content_html|safe }}
    </div>

</div>

{% endblock %}
