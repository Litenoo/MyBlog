version: "3.8"

services:
  frontend:
    build: ./subServices/frontend
    ports:
      - 5173:5173
    depends_on:
      - backend
  backend:
    build: ./subServices/backend
    ports:
     - 3001:3001
    environment:
      DATABASE_URL: "postgres://auto:password@db:5432/mydb"
    depends_on:
     - db
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    volumes:
    - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: